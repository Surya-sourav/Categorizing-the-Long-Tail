seed: 42
seeds: [42, 43, 44]
tail_k: 3
tail_sensitivity: [2, 5]
results_dir: results
logs_dir: results/logs
taxonomy_dir: data/taxonomy
# Dataset key (under `datasets:`) that experiments run against unless overridden.
active_dataset: dc

datasets:
  dc:
    name: dc
    raw_dir: data/raw/dc
    processed_path: data/processed/dc.parquet
    window:
      train_start: "2019-01-01"
      train_end: "2023-12-31"
      test_start: "2024-01-01"
      test_end: null
    volume_rule:
      min_test_txns: 20000
      min_tail_merchants: 2500
      fallback_window:
        train_start: "2019-01-01"
        train_end: "2022-12-31"
        test_start: "2023-01-01"
        test_end: null
  oklahoma:
    name: oklahoma
    raw_dir: data/raw/oklahoma
    processed_path: data/processed/oklahoma.parquet
    ckan_packages: [purchase-card-pcard-fiscal-year-2023, purchase-card-pcard-fiscal-year-2024, purchase-card-pcard-fiscal-year-2025]

fes:
  n_tail: 2500
  n_head: 500
  n_oklahoma: 800
  pilot_n: 100

embed:
  cache_dir: cache/embeddings
  backbones:
    - sentence-transformers/all-MiniLM-L6-v2
    - BAAI/bge-small-en-v1.5
  openai_model: text-embedding-3-small
  openai_price_per_1m: 0.02
  batch_size: 256

index:
  M: 32
  ef_construction: 200
  ef_search: 64
  k: 5

gate:
  mode: threshold
  threshold: 0.65

budget:
  max_usd: 40.0
  ledger_path: cache/spend_ledger.json

search:
  provider: firecrawl         # tavily and brave are also implemented
  cache_dir: cache/web_search
  num_results: 5
  price_per_1k_usd: 10.7      # Firecrawl search = 2 credits/query; reference $0.0053/credit (Hobby plan); credits are prepaid
  min_interval_s: 0.5         # free/hobby plans allow 2 concurrent requests; we stay sequential
  api_key_env: FIRECRAWL_API_KEY
  prepaid: true               # the author's 10k Firecrawl credits are prepaid; reference USD is recorded but not capped

llm:
  cache_dir: cache/llm
  prompt_with_web: prompts/fallback_with_web.txt
  prompt_no_web: prompts/fallback_no_web.txt
  max_completion_tokens: 300
  models:
    - name: gpt-5-nano
      provider: openai
      api_key_env: OPENAI_API_KEY
      price_in_per_1m: 0.05
      price_out_per_1m: 0.40
      reasoning_effort: minimal
      json_mode: json_schema
    - name: gpt-5-mini
      provider: openai
      api_key_env: OPENAI_API_KEY
      price_in_per_1m: 0.25
      price_out_per_1m: 2.00
      reasoning_effort: minimal
      json_mode: json_schema
    - name: google/diffusiongemma-26b-a4b-it
      provider: nvidia
      base_url: https://integrate.api.nvidia.com/v1
      api_key_env: NVIDIA_API_KEY
      price_in_per_1m: 0.10       # reference rate for a hosted ~26B MoE (4B active) open-weight model; the NIM endpoint is free
      price_out_per_1m: 0.40
      reasoning_effort: null
      json_mode: none             # answers in ```json fences; extractor strips them
      timeout_s: 90
      max_completion_tokens: 600
      note: open-weight row (Google DiffusionGemma 26B-A4B, diffusion-based LM); NVIDIA NIM free endpoint; prices are reference rates
    - name: nvidia/nemotron-3-super-120b-a12b
      provider: nvidia
      base_url: https://integrate.api.nvidia.com/v1
      api_key_env: NVIDIA_API_KEY
      price_in_per_1m: 0.30
      price_out_per_1m: 0.90
      reasoning_effort: null
      json_mode: none
      timeout_s: 180
      max_completion_tokens: 600  # verbose evidence strings; 300 truncated 39% of answers in the pilot
      note: second open-weight row (Nemotron 3 Super, 120B MoE / 12B active); NVIDIA NIM free developer endpoint; prices are reference rates

    - name: meta/muse-glimmer-30b
      provider: nvidia
      base_url: https://integrate.api.nvidia.com/v1
      api_key_env: NVIDIA_API_KEY
      price_in_per_1m: 0.20       # reference rate for a hosted ~30B open-weight model; the NIM endpoint is free
      price_out_per_1m: 0.60
      reasoning_effort: null
      json_mode: none
      extra_body: {chat_template_kwargs: {thinking: false, enable_thinking: false}}
      timeout_s: 150              # 8-19 s per call observed
      max_completion_tokens: 600
      note: third open-weight row (Meta Muse Glimmer 30B, multimodal reasoning LM); NVIDIA NIM free endpoint; prices are reference rates

# live cache pass concurrency: workers run in parallel behind one global requests-per-minute limiter
concurrency:
  search_workers: 2             # Firecrawl free/hobby plans allow 2 concurrent requests
  search_rpm: 60
  llm_workers: 16               # OpenAI
  nvidia_workers: 1             # free NIM endpoint effectively serializes a key's requests (4 in flight -> 190 s/call)
  llm_rpm: 38                   # NVIDIA free tier: 40 RPM per key; OpenAI limits are far higher
